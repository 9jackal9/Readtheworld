<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 대구일중학교 자유학기 국어 탐구 대시보드</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Inter & Noto Sans KR) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Noto Sans KR', 'Inter', sans-serif; }
        
        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* 인쇄 최적화 스타일 */
        @media print {
            body { background: white !important; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .worksheet-container { width: 100% !important; max-width: 100% !important; padding: 0 !important; margin: 0 !important; box-shadow: none !important; }
            
            /* 텍스트 상자 이중 테두리 및 스크롤바 제거 */
            textarea, input { 
                border: 1px solid #cbd5e1 !important; 
                resize: none !important; 
                overflow: hidden !important; 
                background-color: #f8fafc !important;
                box-shadow: none !important;
            }
            
            /* 페이지 넘김 제어 */
            .page-break-before { page-break-before: always; }
            .page-break-inside-avoid { page-break-inside: avoid; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased" x-data="appData()">

    <!-- 헤더 영역 (인쇄 시 숨김) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40 no-print shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- 로고 및 뒤로가기 -->
                <div class="flex items-center gap-4">
                    <button x-show="currentView !== 'dashboard'" @click="goToDashboard()" class="text-slate-400 hover:text-indigo-600 transition flex items-center gap-1 font-bold text-sm bg-slate-100 hover:bg-indigo-50 px-3 py-1.5 rounded-lg">
                        <i class="fa-solid fa-chevron-left"></i> 목록으로
                    </button>
                    <div class="flex items-center gap-2 cursor-pointer" @click="goToDashboard()">
                        <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded">세상읽기반</span>
                        <h1 class="text-lg font-extrabold text-slate-800 tracking-tight">대구일중 자유학기 국어</h1>
                    </div>
                </div>
                <!-- 핵심 질문 -->
                <div class="hidden md:flex flex-1 justify-end">
                    <div class="bg-indigo-50 border border-indigo-100 px-4 py-2 rounded-full shadow-inner flex items-center gap-2">
                        <i class="fa-solid fa-lightbulb text-amber-500"></i>
                        <span class="text-sm font-bold text-indigo-900 whitespace-nowrap">핵심 질문 : 글쓰기는 어떠한 방식으로 공동체 구성원을 연결하는가?</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 transition-all duration-300">
        
        <!-- ========================================== -->
        <!-- [1] 대시보드 화면 (목록) -->
        <!-- ========================================== -->
        <div x-show="currentView === 'dashboard'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-4" x-transition:enter-end="opacity-100 translate-y-0" style="display: none;">
            
            <div class="flex flex-col lg:flex-row gap-8">
                
                <!-- 좌측: 탐구 활동 목록 -->
                <div class="flex-1">
                    <!-- 단계 필터 -->
                    <div class="mb-6 flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                        <template x-for="stage in stages" :key="stage.id">
                            <button @click="currentStage = stage.id" 
                                class="px-4 py-2 rounded-full text-sm font-bold transition-all whitespace-nowrap border shadow-sm"
                                :class="currentStage === stage.id ? stage.color + ' text-white border-transparent' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'">
                                <i class="fa-solid" :class="stage.icon"></i>
                                <span class="ml-1" x-text="stage.name"></span>
                            </button>
                        </template>
                    </div>

                    <!-- 차시 목록 (그리드) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <template x-for="lesson in filteredLessons" :key="lesson.id">
                            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition p-5 flex flex-col h-full relative overflow-hidden group">
                                <div class="absolute top-0 left-0 w-1 h-full" :class="getStageColor(lesson.stageId)"></div>
                                
                                <div class="flex justify-between items-start mb-3">
                                    <span class="text-xs font-bold px-2.5 py-1 rounded-md" :class="getStageBg(lesson.stageId)" x-text="lesson.time"></span>
                                </div>
                                
                                <h3 class="text-lg font-bold text-slate-800 mb-2 leading-tight group-hover:text-indigo-600 transition" x-text="lesson.title"></h3>
                                <p class="text-sm text-slate-500 mb-6 flex-1 line-clamp-2" x-text="lesson.desc"></p>
                                
                                <button @click="enterLesson(lesson)" class="w-full py-2.5 bg-slate-900 hover:bg-indigo-600 text-white rounded-xl text-sm font-bold transition flex items-center justify-center gap-2 shadow-sm">
                                    수업 입장 <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- 우측: 사이드바 (인성 명언) -->
                <div class="w-full lg:w-80 space-y-6">
                    <!-- 인성 명언 카드 -->
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 relative overflow-hidden">
                        <div class="absolute -right-4 -top-4 text-emerald-100 opacity-50">
                            <i class="fa-solid fa-quote-right text-8xl"></i>
                        </div>
                        <div class="relative z-10">
                            <h3 class="text-sm font-extrabold text-emerald-600 mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-seedling"></i> 마음을 다지는 인성 한 스푼
                            </h3>
                            <div class="min-h-[120px] flex flex-col justify-center">
                                <p class="text-slate-800 font-medium text-lg leading-snug mb-3" x-text="currentQuote.text"></p>
                                <p class="text-xs text-slate-500 font-bold text-right" x-text="'- ' + currentQuote.author"></p>
                            </div>
                            <div class="mt-4 pt-4 border-t border-slate-100">
                                <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg" x-html="'<strong>💡 배움:</strong> ' + currentQuote.lesson"></p>
                            </div>
                            <div class="mt-4 flex justify-between items-center">
                                <span class="text-xs text-slate-400 font-bold" x-text="'명언 ' + (quoteIndex + 1) + ' / ' + quotes.length"></span>
                                <div class="flex gap-1">
                                    <button @click="prevQuote()" class="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded transition"><i class="fa-solid fa-chevron-left"></i></button>
                                    <button @click="nextQuote()" class="p-1.5 text-slate-400 hover:text-emerald-600 hover:bg-emerald-50 rounded transition"><i class="fa-solid fa-chevron-right"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ========================================== -->
        <!-- [2] 수업 화면 (Classroom View) -->
        <!-- ========================================== -->
        <div x-show="currentView === 'lesson'" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-x-4" x-transition:enter-end="opacity-100 translate-x-0" style="display: none;">
            
            <template x-if="currentLesson">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col max-h-[85vh]">
                    
                    <!-- 수업 헤더 (인쇄 시 숨김) -->
                    <div class="bg-slate-900 p-6 sm:p-8 text-white relative overflow-hidden no-print flex-shrink-0">
                        <div class="absolute top-0 right-0 p-8 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                            <i class="fa-solid fa-book-open-reader text-9xl"></i>
                        </div>
                        <div class="relative z-10 max-w-4xl">
                            <div class="flex items-center gap-3 mb-3">
                                <span class="bg-indigo-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm" x-text="'시기 : ' + currentLesson.time"></span>
                                <span class="bg-white/20 text-white text-xs font-bold px-3 py-1 rounded-full backdrop-blur-sm" x-text="getStageName(currentLesson.stageId)"></span>
                            </div>
                            <h2 class="text-2xl sm:text-3xl font-extrabold mb-2 leading-tight" x-text="currentLesson.title"></h2>
                            <p class="text-slate-300 text-sm sm:text-base max-w-2xl" x-text="currentLesson.desc"></p>
                        </div>
                    </div>

                    <!-- 탭 네비게이션 (인쇄 시 숨김) -->
                    <div class="border-b border-slate-200 bg-slate-50 px-4 sm:px-8 flex gap-1 overflow-x-auto scrollbar-hide no-print flex-shrink-0">
                        <button @click="lessonTab = 'explanation'" class="px-5 py-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap" :class="lessonTab === 'explanation' ? 'border-indigo-600 text-indigo-700' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'">
                            <i class="fa-solid fa-chalkboard-user mr-1.5"></i> ① 개념 설명 <span class="text-xs font-normal ml-1 text-slate-400">(15분)</span>
                        </button>
                        <button @click="lessonTab = 'caution'" class="px-5 py-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap" :class="lessonTab === 'caution' ? 'border-rose-500 text-rose-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'">
                            <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> ② 주의 사항 <span class="text-xs font-normal ml-1 text-slate-400">(5분)</span>
                        </button>
                        <button @click="lessonTab = 'activity'" class="px-5 py-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap" :class="lessonTab === 'activity' ? 'border-amber-500 text-amber-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'">
                            <i class="fa-solid fa-users-gear mr-1.5"></i> ③ 학생 활동 <span class="text-xs font-normal ml-1 text-slate-400">(60분)</span>
                        </button>
                        <!-- 학습지 탭 (모든 차시에 복구) -->
                        <button x-show="safeLessonDetail.hasWorksheet" @click="lessonTab = 'worksheet'" class="px-5 py-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap" :class="lessonTab === 'worksheet' ? 'border-emerald-500 text-emerald-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'">
                            <i class="fa-solid fa-file-lines mr-1.5"></i> ④ 탐구 학습지
                        </button>
                    </div>

                    <!-- 탭 컨텐츠 영역 (스크롤 가능 영역) -->
                    <div class="p-4 sm:p-8 overflow-y-auto flex-1 bg-white relative">
                        
                        <!-- ① 개념 설명 -->
                        <div x-show="lessonTab === 'explanation'" class="max-w-4xl mx-auto space-y-6">
                            <div class="bg-indigo-50 p-5 rounded-xl border border-indigo-100 flex items-start gap-4">
                                <div class="bg-indigo-600 text-white w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 shadow-sm"><i class="fa-solid fa-bullseye"></i></div>
                                <div>
                                    <h4 class="text-sm font-bold text-indigo-900 mb-1">이번 시간 배움 목표</h4>
                                    <p class="text-indigo-800" x-html="safeLessonDetail.explanation.target"></p>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <template x-for="(step, idx) in safeLessonDetail.explanation.steps" :key="idx">
                                    <div class="border border-slate-200 p-5 rounded-xl bg-white shadow-sm hover:shadow-md transition">
                                        <div class="text-xs font-bold text-slate-400 mb-1" x-text="'STEP ' + (idx + 1)"></div>
                                        <h5 class="text-lg font-bold text-slate-800 mb-2" x-text="step.title"></h5>
                                        <p class="text-slate-600 text-sm leading-relaxed" x-text="step.desc"></p>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- ② 주의 사항 (AI 윤리 포함) -->
                        <div x-show="lessonTab === 'caution'" class="max-w-4xl mx-auto">
                            <div class="bg-rose-50 rounded-2xl border border-rose-100 p-6 md:p-8 flex flex-col md:flex-row gap-6 items-center md:items-start">
                                <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-2xl flex items-center justify-center text-3xl flex-shrink-0 shadow-inner">
                                    <i class="fa-solid fa-hand-sparkles"></i>
                                </div>
                                <div class="flex-1 text-center md:text-left">
                                    <h4 class="text-lg font-extrabold text-rose-900 mb-2" x-text="safeLessonDetail.caution.target"></h4>
                                    <p class="text-rose-700 leading-relaxed" x-html="safeLessonDetail.caution.content"></p>
                                    <div class="mt-4 inline-block bg-white px-4 py-2 rounded-lg text-sm font-bold text-slate-700 shadow-sm border border-rose-100">
                                        <i class="fa-solid fa-check text-rose-500 mr-1"></i> 올바른 디지털 시민 의식을 실천합시다.
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ③ 학생 활동 -->
                        <div x-show="lessonTab === 'activity'" class="max-w-4xl mx-auto space-y-8">
                            <div class="text-center mb-8">
                                <h4 class="text-xl font-extrabold text-slate-800 mb-2" x-text="safeLessonDetail.activity.target"></h4>
                                <p class="text-slate-500 text-sm">모둠원과 협력하여 아래 활동을 순서대로 진행해 주세요.</p>
                            </div>

                            <div class="space-y-6">
                                <template x-for="(step, idx) in safeLessonDetail.activity.steps" :key="idx">
                                    <div class="relative pl-10 md:pl-14">
                                        <!-- 타임라인 선 -->
                                        <div class="absolute left-[19px] md:left-[27px] top-10 bottom-[-24px] w-0.5 bg-slate-200" x-show="idx !== safeLessonDetail.activity.steps.length - 1"></div>
                                        
                                        <!-- 활동 마커 -->
                                        <div class="absolute left-0 md:left-2 top-1.5 w-10 h-10 bg-white border-2 border-amber-400 text-amber-600 font-extrabold rounded-full flex items-center justify-center shadow-sm z-10" x-text="idx + 1"></div>
                                        
                                        <div class="bg-white border border-slate-200 p-5 md:p-6 rounded-2xl shadow-sm">
                                            <div class="flex flex-col md:flex-row md:items-center justify-between mb-3 gap-2">
                                                <h5 class="text-lg font-bold text-slate-800" x-text="step.title"></h5>
                                                
                                                <div class="flex items-center gap-2">
                                                    <!-- ★ 학습지 인쇄 버튼 (강제 노출) -->
                                                    <button x-show="step.hasWorksheetButton && safeLessonDetail.hasWorksheet" @click="printWorksheet()" class="px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg shadow-sm transition flex items-center gap-1.5">
                                                        <i class="fa-solid fa-file-pdf"></i> 탐구학습지 PDF 인쇄
                                                    </button>
                                                    
                                                    <span class="text-xs font-bold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full" x-text="step.time"></span>
                                                </div>
                                            </div>
                                            <p class="text-sm text-slate-600 leading-relaxed" x-html="step.desc"></p>
                                            
                                            <!-- ★ 가짜뉴스 교사 예시 답안 이미지 토글 (안전한 구현 방식) -->
                                            <template x-if="step.hasFakeNewsAnswer">
                                                <div x-data="{ showAnswer: false }" class="mt-5 p-4 bg-slate-50 border border-slate-200 rounded-xl shadow-sm">
                                                    <div class="flex justify-between items-center">
                                                        <span class="text-sm font-bold text-slate-700">모둠 토의가 끝났다면 확인해보세요!</span>
                                                        <button @click="showAnswer = !showAnswer" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold transition flex items-center gap-2 shadow-sm">
                                                            <i class="fa-solid" :class="showAnswer ? 'fa-eye-slash' : 'fa-eye'"></i>
                                                            <span x-text="showAnswer ? '교사 예시 답안 닫기' : '교사 예시 답안 보기 (가짜뉴스 식별법)'"></span>
                                                        </button>
                                                    </div>
                                                    <!-- 이미지 표시 영역 (띄어쓰기 파일명 원본 유지, 에러 시 인코딩) -->
                                                    <div x-show="showAnswer" x-collapse class="mt-4 pt-4 border-t border-slate-200 flex justify-center">
                                                        <img src="스크린샷 2026-09-07 090016.jpg" onerror="this.onerror=null; this.src='스크린샷%202026-09-07%20090016.jpg';" alt="가짜뉴스 식별법" class="max-w-full rounded-lg shadow-sm border border-slate-200">
                                                    </div>
                                                </div>
                                            </template>

                                            <!-- ★ 학습지 입력 안내 바 -->
                                            <div x-show="step.hasWorksheetButton && safeLessonDetail.hasWorksheet" class="mt-5 p-4 bg-amber-50 border border-amber-200 rounded-xl flex flex-col sm:flex-row items-center justify-between gap-3 shadow-sm">
                                                <div class="text-sm text-amber-900 flex items-center gap-2">
                                                    <i class="fa-solid fa-pen-to-square text-amber-600"></i>
                                                    <span><strong>개별 작성 및 제출:</strong> 활동 내용을 바탕으로 학습지를 완성하세요.</span>
                                                </div>
                                                <button @click="lessonTab = 'worksheet'" class="px-4 py-2 bg-white hover:bg-amber-100 text-amber-800 border border-amber-300 rounded-lg text-sm font-bold transition whitespace-nowrap">
                                                    학습지 입력 화면으로 이동
                                                </button>
                                            </div>

                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- ④ 탐구 학습지 (PDF 출력 화면) -->
                        <div x-show="lessonTab === 'worksheet'" class="worksheet-container max-w-4xl mx-auto bg-white print-only" id="worksheetArea">
                            
                            <!-- 인쇄 전용 헤더 -->
                            <div class="hidden print-only text-center mb-6">
                                <h1 class="text-2xl font-extrabold text-black mb-1">자유학기 국어 탐구학습지</h1>
                                <p class="text-sm text-gray-600">대구일중학교 세상읽기반</p>
                            </div>

                            <!-- 학습지 상단 타이틀 박스 (디자인 원상복구: 흰색 배경, 회색/남색 텍스트, 인디고 테두리) -->
                            <div class="bg-white border border-slate-300 border-l-4 border-l-indigo-600 p-6 rounded-xl mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="bg-indigo-100 text-indigo-800 text-xs font-bold px-2.5 py-1 rounded-md" x-text="'시기: ' + currentLesson.time"></span>
                                        <span class="text-sm font-bold text-slate-500" x-text="getStageName(currentLesson.stageId)"></span>
                                    </div>
                                    <h2 class="text-xl font-extrabold text-slate-900 mb-1" x-text="currentLesson.title"></h2>
                                    <p class="text-sm text-slate-600" x-text="safeLessonDetail.explanation.target"></p>
                                </div>
                                <!-- 인적사항 (학생이 직접 수기로 적을 수 있게 빈칸 처리) -->
                                <div class="bg-slate-50 border border-slate-200 p-3 rounded-lg w-full md:w-auto text-sm font-bold text-slate-700 min-w-[250px]">
                                    <div class="flex items-center justify-between gap-4 mb-2">
                                        <span>1학년</span>
                                        <div class="flex items-center gap-1"><input type="text" class="w-8 border-b border-slate-400 bg-transparent text-center focus:outline-none focus:border-indigo-500">반</div>
                                        <div class="flex items-center gap-1"><input type="text" class="w-8 border-b border-slate-400 bg-transparent text-center focus:outline-none focus:border-indigo-500">번</div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <span>이름 :</span>
                                        <input type="text" class="flex-1 border-b border-slate-400 bg-transparent focus:outline-none focus:border-indigo-500">
                                    </div>
                                </div>
                            </div>

                },

                // 에러 방지용 안전한 데이터 반환 Getter
                get safeLessonDetail() {
                    if (!this.currentLesson) return this.getDefaultDetail();
                    return this.lessonDetails[this.currentLesson.id] || this.getDefaultDetail();
                },
                
                // 데이터가 없을 때 앱이 죽지 않도록 빈 골격 반환
                getDefaultDetail() {
                    return {
                        hasWorksheet: false,
                        explanation: { target: '', steps: [] },
                        caution: { target: '', content: '' },
                        activity: { target: '', steps: [] },
                        worksheet: { isSubmissionLesson: false, questions: [] }
                    };
                },

                get filteredLessons() {
                    if (this.currentStage === 'all') return this.lessons;
                    return this.lessons.filter(l => l.stageId === this.currentStage);
                },

                getStageName(stageId) {
                    const stage = this.stages.find(s => s.id === stageId);
                    return stage ? stage.name : '';
                },
                getStageColor(stageId) {
                    const stage = this.stages.find(s => s.id === stageId);
                    return stage ? stage.color : 'bg-slate-800';
                },
                getStageBg(stageId) {
                    const colors = { 'stage1': 'bg-blue-100 text-blue-700', 'stage2': 'bg-emerald-100 text-emerald-700', 'stage3': 'bg-purple-100 text-purple-700', 'stage4': 'bg-rose-100 text-rose-700' };
                    return colors[stageId] || 'bg-slate-100 text-slate-700';
                },

                initApp() {
                    setInterval(() => { this.nextQuote(); }, 15000); // 15초마다 명언 변경
                },
                nextQuote() { this.quoteIndex = (this.quoteIndex + 1) % this.quotes.length; },
                prevQuote() { this.quoteIndex = (this.quoteIndex - 1 + this.quotes.length) % this.quotes.length; },
                
                enterLesson(lesson) {
                    this.currentLesson = lesson;
                    this.lessonTab = 'explanation';
                    this.currentView = 'lesson';
                    window.scrollTo({top: 0, behavior: 'smooth'});
                },
                goToDashboard() {
                    this.currentView = 'dashboard';
                    this.currentLesson = null;
                },

                // PDF 인쇄 전용 함수 (글자 잘림 방지 Auto-resize 기능 포함)
                printWorksheet() {
                    this.lessonTab = 'worksheet';
                    
                    setTimeout(() => {
                        // 텍스트 상자 높이 자동 조절 (이중 테두리 및 스크롤바 방지)
                        const textareas = document.querySelectorAll('#worksheetArea textarea');
                        textareas.forEach(t => {
                            t.style.height = 'auto'; // 높이 초기화
                            if(t.scrollHeight > 0) {
                                t.style.height = t.scrollHeight + 'px'; // 입력된 글자만큼 높이 늘리기
                            }
                        });
                        
                        // 인쇄 실행
                        window.print();
                    }, 400); // 렌더링 후 인쇄 대화창 띄우기
                }
            };
        }
    </script>
